<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Zenith – Reporting</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1f2436;--border:#2a3048;
  --accent:#6366f1;--accent2:#818cf8;
  --green:#22c55e;--green-dim:#0d2618;
  --amber:#f59e0b;--amber-dim:#1f1608;
  --red:#ef4444;--red-dim:#2a0f0f;
  --blue:#3b82f6;--blue-dim:#0d1f3c;
  --text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;min-height:100vh;padding-bottom:32px;}

/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:380px;}
.login-logo{text-align:center;margin-bottom:24px;}
.login-logo img{width:64px;height:64px;border-radius:12px;object-fit:cover;}
.login-logo h1{font-size:20px;font-weight:700;color:var(--accent2);margin-top:10px;}
.login-logo p{font-size:12px;color:var(--text3);margin-top:3px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
.field input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;color:var(--text);font-size:15px;outline:none;}
.field input:focus{border-color:var(--accent);}
.btn-login{width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;}
.err{background:var(--red-dim);border:1px solid var(--red);color:var(--red);border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none;}

/* APP */
#app{display:none;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-logo{display:flex;align-items:center;gap:8px;}
.topbar-logo img{width:28px;height:28px;border-radius:6px;object-fit:cover;}
.topbar-title{font-size:15px;font-weight:700;color:var(--accent2);}
.topbar-right{display:flex;align-items:center;gap:8px;}
.user-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 10px;font-size:12px;color:var(--text2);}
.btn-logout{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text3);font-size:12px;cursor:pointer;}

.content{padding:16px;}
.section-title{font-size:13px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;margin-top:20px;}
.section-title:first-child{margin-top:0;}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px;}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;}
.stat-label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;font-weight:600;}
.stat-value{font-size:22px;font-weight:700;margin-top:4px;}
.stat-value.green{color:var(--green);}
.stat-value.red{color:var(--red);}
.stat-value.blue{color:var(--blue);}
.stat-value.amber{color:var(--amber);}
.stat-value.purple{color:#a78bfa;}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:space-between;}
.card-body{padding:14px 16px;}

/* Filters */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;flex:1;min-width:120px;}

/* Incoherence list */
.inco-item{padding:12px 0;border-bottom:1px solid var(--border);}
.inco-item:last-child{border-bottom:none;}
.inco-name{font-weight:500;font-size:14px;}
.inco-meta{font-size:12px;color:var(--text3);margin-top:2px;}
.badge{display:inline-flex;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.badge-red{background:var(--red-dim);color:var(--red);}
.badge-amber{background:var(--amber-dim);color:var(--amber);}
.badge-green{background:var(--green-dim);color:var(--green);}

/* Monthly table */
.month-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.month-row:last-child{border-bottom:none;}
.month-name{font-weight:500;width:80px;font-size:13px;flex-shrink:0;}
.month-vals{flex:1;display:flex;flex-direction:column;gap:3px;}
.month-bar-wrap{background:var(--surface2);border-radius:4px;height:6px;overflow:hidden;}
.month-bar{height:100%;border-radius:4px;}
.month-amounts{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);}
.month-bene{font-weight:700;font-size:13px;min-width:70px;text-align:right;flex-shrink:0;}

/* Repartition */
.rep-bar{display:flex;border-radius:10px;overflow:hidden;height:16px;margin:10px 0 14px;}
.rep-bar-a{background:var(--accent);}
.rep-bar-b{background:var(--amber);}
.rep-person{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:10px;background:var(--surface2);margin-bottom:8px;}
.rep-person-info{font-size:13px;font-weight:500;}
.rep-person-pct{font-size:10px;color:var(--text3);margin-top:2px;}
.rep-person-amount{font-size:18px;font-weight:700;}

/* Niveau stats */
.level-row{margin-bottom:10px;}
.level-row-top{display:flex;justify-content:space-between;margin-bottom:4px;font-size:13px;}
.level-bar-wrap{background:var(--surface2);border-radius:4px;height:8px;overflow:hidden;}
.level-bar{height:100%;border-radius:4px;transition:width .4s;}

/* Active students */
.active-stat-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);}
.active-stat-row:last-child{border-bottom:none;}

/* Reinscription */
.reinsc-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;}
.reinsc-stat{padding:12px;border-radius:10px;text-align:center;}
.reinsc-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:4px;}
.reinsc-stat-val{font-size:22px;font-weight:700;}

/* Loading */
.loading{text-align:center;padding:32px;color:var(--text3);}
.spinner{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin:0 auto 10px;}
@keyframes spin{to{transform:rotate(360deg)}}

/* Splash */
#splash{display:flex;position:fixed;inset:0;background:var(--bg);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:12px;}
#splash img{width:72px;height:72px;border-radius:14px;object-fit:cover;}
#splash p{font-size:13px;color:var(--text3);}
</style>
</head>

// ===== AUTH =====
async function doLogin(){
  const u=document.getElementById('l-user').value.trim();
  const p=document.getElementById('l-pass').value;
  if(!u||!p){showErr('Remplir tous les champs.');return;}
  showErr('');
  const btn=document.querySelector('.btn-login');
  btn.textContent='Connexion…';btn.disabled=true;
  try{
    const {data:rows,error:qerr}=await sb.from('users').select('*').eq('username',u);
    if(qerr){showErr('Erreur Supabase: '+qerr.message);btn.textContent='Se connecter';btn.disabled=false;return;}
    const data=rows?rows.find(r=>r.password===p):null;
    const error=null;
    if(error){
      showErr('Erreur Supabase: '+error.message+' (code: '+error.code+')');
      btn.textContent='Se connecter';btn.disabled=false;return;
    }
    if(!data){
      showErr('Identifiant ou mot de passe incorrect.');
      btn.textContent='Se connecter';btn.disabled=false;return;
    }
    if(data.role!=='admin'){
      showErr('Accès réservé aux administrateurs. Rôle: '+data.role);
      btn.textContent='Se connecter';btn.disabled=false;return;
    }
    currentUser=data;
    localStorage.setItem('zenith_mob_user',JSON.stringify(data));
    showApp();
  }catch(e){
    showErr('Exception: '+e.message);
    btn.textContent='Se connecter';btn.disabled=false;
  }
}
function showErr(m){const e=document.getElementById('login-err');e.textContent=m;e.style.display=m?'block':'none';}
function logout(){localStorage.removeItem('zenith_mob_user');location.reload();}

function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('user-chip').textContent=currentUser.name||'Admin';
  loadReport();
}

// ===== LOAD DATA =====
async function loadReport(){
  const [sr,cr,rr]=await Promise.all([
    sb.from('students').select('*'),
    sb.from('charges').select('*'),
    sb.from('receipts').select('*')
  ]);
  _students=sr.data||[];
  _charges=cr.data||[];
  _receipts=rr.data||[];
  renderAll();
}

function renderAll(){
  renderStats();
  updateRep();
  renderActive();
  updateLevels();
  renderInco();
  renderMonthly();
  updateReinsc();
}

// ===== STATS =====
function renderStats(){
  const fm2=document.getElementById('rep-month').value;
  const months=fm2?[fm2]:MONTHS;
  const totalRev=_students.reduce((a,s)=>a+months.reduce((b,m)=>b+(s.paiements?.[m]||0),0),0);
  const totalC=_charges.reduce((a,c)=>a+MONTHS_C.reduce((b,m)=>{
    const mk=Object.keys(M_TO_C).find(k=>M_TO_C[k]===m);
    return b+((!fm2||mk===fm2)?(c.montants?.[m]||0):0);
  },0),0);
  const totalRec=_receipts.filter(r=>!fm2||r.month===fm2).reduce((a,r)=>a+(r.amount||0),0);
  const inco=_receipts.filter(r=>(!fm2||r.month===fm2)&&(r.amount||0)!==(r.registered_amount||0));
  const totalAss=_students.filter(s=>s.assurance>0&&MONTHS.some(m=>(s.paiements?.[m]||0)>0)).reduce((a,s)=>a+(s.assurance||0),0);
  document.getElementById('stats-grid').innerHTML=
    stat('Revenus','green',fm(totalRev))+
    stat('Charges','red',fm(totalC))+
    stat('Reçus','blue',fm(totalRec))+
    stat('Bénéfice','green',fm(totalRev-totalC))+
    stat('Incohérences',inco.length>0?'red':'green',inco.length)+
    stat('Assurances','amber',fm(totalAss));
}
function stat(l,cls,v){return`<div class="stat"><div class="stat-label">${l}</div><div class="stat-value ${cls}">${v}</div></div>`;}

// ===== REPARTITION =====
function updateRep(){
  const period=document.getElementById('rep-benef-period').value;
  const months=period==='all'?MONTHS:[period];
  const benef=months.reduce((acc,m)=>{
    const mk=M_TO_C[m];if(!mk)return acc;
    const rev=_students.reduce((a,s)=>a+(s.paiements?.[m]||0),0);
    const ch=_charges.reduce((a,c)=>a+(c.montants?.[mk]||0),0);
    return acc+(rev-ch);
  },0);
  const ilyass=benef*0.65, assoc=benef*0.35;
  const isPos=benef>=0;
  const label=period==='all'?"Toute l'ann\u00e9e":period;
  document.getElementById('rep-body').innerHTML=
    `<div style="font-size:12px;color:var(--text3);margin-bottom:4px;">${label}</div>`+
    `<div style="font-size:26px;font-weight:700;color:${isPos?'var(--green)':'var(--red)'};margin-bottom:10px;">${fm(benef)}</div>`+
    `<div class="rep-bar"><div class="rep-bar-a" style="width:65%"></div><div class="rep-bar-b" style="width:35%"></div></div>`+
    rperson('ILYAS BOUZID','Gérant — 65%','var(--accent2)',ilyass)+
    rperson('ASSOCI\u00c9','Part associ\u00e9 — 35%','var(--amber)',assoc);
}
function rperson(name,role,color,amount){
  return`<div class="rep-person"><div><div class="rep-person-info">${name}</div><div class="rep-person-pct">${role}</div></div><div class="rep-person-amount" style="color:${color}">${fm(amount)}</div></div>`;
}

// ===== ACTIVE STUDENTS =====
function renderActive(){
  const cur=CURRENT_MONTH;
  const curIdx=MONTHS.indexOf(cur);
  const prev=curIdx>0?MONTHS[curIdx-1]:null;
  const active=_students.filter(s=>(s.paiements?.[cur]||0)>0||(prev&&(s.paiements?.[prev]||0)>0));
  const paid=active.filter(s=>(s.paiements?.[cur]||0)>0);
  const waiting=active.filter(s=>(s.paiements?.[cur]||0)===0);
  document.getElementById('active-body').innerHTML=
    arow('Mois analysé','<span class="badge" style="background:var(--blue-dim);color:var(--blue)">'+cur+'</span>')+
    arow('Total actifs','<span style="font-size:18px;font-weight:700;color:var(--blue)">'+active.length+'</span>')+
    '<div style="height:1px;background:var(--border);margin:4px 0;"></div>'+
    arow('✅ Ont payé ce mois','<span class="badge badge-green">'+paid.length+'</span>')+
    arow('⏳ En attente','<span class="badge badge-amber">'+waiting.length+'</span>')+
    (prev?`<div style="font-size:11px;color:var(--text3);margin-top:10px;padding:8px;background:var(--surface2);border-radius:8px;">Actif = payé <strong>${cur}</strong> ou <strong>${prev}</strong></div>`:'');
}
function arow(l,r){return`<div class="active-stat-row"><span style="font-size:13px;color:var(--text2)">${l}</span>${r}</div>`;}

// ===== LEVELS =====
function updateLevels(){
  const month=document.getElementById('level-month').value;
  let filtered;
  if(month==='all'){filtered=_students;}
  else{
    const pi=MONTHS.indexOf(month);
    const pv=pi>0?MONTHS[pi-1]:null;
    filtered=_students.filter(s=>(s.paiements?.[month]||0)>0||(pv&&(s.paiements?.[pv]||0)>0));
  }
  const total=filtered.length;
  const levels={};
  filtered.forEach(s=>{const lv=s.niveau||'N/A';levels[lv]=(levels[lv]||0)+1;});
  const sorted=Object.entries(levels).sort((a,b)=>b[1]-a[1]);
  const maxV=sorted.length?sorted[0][1]:1;
  const colors=['#6366f1','#22c55e','#f59e0b','#3b82f6','#ef4444','#a78bfa','#f472b6','#34d399'];
  document.getElementById('levels-body').innerHTML=
    `<div style="font-size:12px;color:var(--text3);margin-bottom:12px;">Total : <strong style="color:var(--text)">${total} étudiants</strong></div>`+
    sorted.map(([lv,count],i)=>{
      const pct=total>0?Math.round(count/total*100):0;
      const bw=Math.round(count/maxV*100);
      const col=colors[i%colors.length];
      return`<div class="level-row"><div class="level-row-top"><span style="font-weight:500">${lv}</span><span style="color:${col};font-weight:700">${pct}%</span></div><div class="level-bar-wrap"><div class="level-bar" style="width:${bw}%;background:${col}"></div></div><div style="font-size:10px;color:var(--text3);margin-top:2px;">${count} étudiant${count>1?'s':''}</div></div>`;
    }).join('');
}

// ===== INCOHERENCES =====
function renderInco(){
  const fm2=document.getElementById('rep-month').value;
  const inco=_receipts.filter(r=>(!fm2||r.month===fm2)&&(r.amount||0)!==(r.registered_amount||0));
  if(inco.length===0){
    document.getElementById('inco-body').innerHTML='<div style="text-align:center;padding:16px;color:var(--green);">✅ Aucune incohérence</div>';
    return;
  }
  document.getElementById('inco-body').innerHTML=inco.map(r=>{
    const diff=(r.amount||0)-(r.registered_amount||0);
    return`<div class="inco-item"><div style="display:flex;justify-content:space-between;align-items:flex-start;"><div><div class="inco-name">${r.student_name||'–'}</div><div class="inco-meta">${r.month} · Inscrit: ${fm(r.registered_amount||0)}</div></div><div style="text-align:right"><span class="badge ${diff>0?'badge-amber':'badge-red'}">${diff>0?'+':''}${fm(diff)}</span><div class="inco-meta" style="margin-top:3px;">Reçu: ${fm(r.amount||0)}</div></div></div></div>`;
  }).join('');
}

// ===== MONTHLY =====
function renderMonthly(){
  const rows=MONTHS.map(m=>{
    const mk=M_TO_C[m];if(!mk)return null;
    const rev=_students.reduce((a,s)=>a+(s.paiements?.[m]||0),0);
    const ch=_charges.reduce((a,c)=>a+(c.montants?.[mk]||0),0);
    const rec=_receipts.filter(r=>r.month===m).reduce((a,r)=>a+(r.amount||0),0);
    const bene=rev-ch;
    const max=Math.max(rev,ch,1);
    return{m,rev,ch,rec,bene,max};
  }).filter(Boolean);
  document.getElementById('monthly-body').innerHTML=rows.map(({m,rev,ch,rec,bene,max})=>
    `<div class="month-row"><div class="month-name">${m.substring(0,4)}</div><div class="month-vals"><div class="month-amounts"><span style="color:var(--green)">${fm(rev)}</span><span style="color:var(--red)">${fm(ch)}</span></div><div class="month-bar-wrap"><div class="month-bar" style="width:${Math.round(rev/max*100)}%;background:var(--green)"></div></div></div><div class="month-bene" style="color:${bene>=0?'var(--green)':'var(--red)'}">${fm(bene)}</div></div>`
  ).join('');
}

// ===== REINSCRIPTION =====
function updateReinsc(){
  const from=document.getElementById('reinsc-from').value;
  const to=document.getElementById('reinsc-to').value;
  const fi=MONTHS.indexOf(from),ti=MONTHS.indexOf(to);
  if(fi===-1||ti===-1||fi>=ti){document.getElementById('reinsc-body').innerHTML='<div style="color:var(--red);font-size:13px;">Sélection invalide</div>';return;}
  const range=MONTHS.slice(fi,ti+1);
  const totalActive=_students.filter(s=>(s.paiements?.[from]||0)>0).length;
  const reinsc=_students.filter(s=>range.every(m=>(s.paiements?.[m]||0)>0));
  const drops=_students.filter(s=>(s.paiements?.[from]||0)>0&&!range.every(m=>(s.paiements?.[m]||0)>0));
  const rate=totalActive>0?Math.round(reinsc.length/totalActive*100):0;
  document.getElementById('reinsc-body').innerHTML=
    `<div class="reinsc-stats"><div class="reinsc-stat" style="background:var(--blue-dim)"><div class="reinsc-stat-label" style="color:var(--blue)">Base ${from}</div><div class="reinsc-stat-val" style="color:var(--blue)">${totalActive}</div></div><div class="reinsc-stat" style="background:var(--green-dim)"><div class="reinsc-stat-label" style="color:var(--green)">Réinscrits</div><div class="reinsc-stat-val" style="color:var(--green)">${reinsc.length}</div></div><div class="reinsc-stat" style="background:var(--red-dim)"><div class="reinsc-stat-label" style="color:var(--red)">Abandons</div><div class="reinsc-stat-val" style="color:var(--red)">${drops.length}</div></div></div>`+
    `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;"><div style="flex:1;background:var(--surface2);border-radius:8px;overflow:hidden;height:16px;"><div style="width:${rate}%;height:100%;background:var(--green);border-radius:8px;transition:.4s"></div></div><div style="font-size:24px;font-weight:700;color:var(--green);min-width:60px;text-align:right">${rate}%</div></div>`+
    `<div style="font-size:11px;color:var(--text3);">Ont payé tous les ${range.length} mois · ${from} → ${to}</div>`+
    '<div style="margin-top:12px;">'+range.map(m=>{
      const paid=_students.filter(s=>(s.paiements?.[from]||0)>0&&(s.paiements?.[m]||0)>0).length;
      const pct=totalActive>0?Math.round(paid/totalActive*100):0;
      const col=pct>=80?'var(--green)':pct>=50?'var(--amber)':'var(--red)';
      return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><div style="width:60px;font-size:11px;color:var(--text2);flex-shrink:0">${m.substring(0,4)}</div><div style="flex:1;background:var(--surface2);border-radius:4px;height:6px;overflow:hidden;"><div style="width:${Math.min(pct,100)}%;height:100%;background:${col};border-radius:4px"></div></div><div style="font-size:11px;font-weight:600;color:${col};min-width:36px;text-align:right">${pct}%</div><div style="font-size:10px;color:var(--text3);min-width:42px">${paid}/${totalActive}</div></div>`;
    }).join('')+'</div>';
}

// ===== INIT =====
(async()=>{
  sb=supabase.createClient(SB_URL,SB_KEY);
  const saved=localStorage.getItem('zenith_mob_user');
  if(saved){
    try{
      const u=JSON.parse(saved);
      if(u.role==='admin'){currentUser=u;document.getElementById('splash').style.display='none';showApp();return;}
    }catch(e){}
  }
  // Test connection
  try{
    const {error}=await sb.from('users').select('count',{count:'exact',head:true});
    if(error){
      document.getElementById('splash').style.display='none';
      document.getElementById('login-screen').style.display='flex';
      showErr('Connexion Supabase: '+error.message);
      return;
    }
  }catch(e){
    document.getElementById('splash').style.display='none';
    document.getElementById('login-screen').style.display='flex';
    showErr('Impossible de joindre Supabase: '+e.message);
    return;
  }
  document.getElementById('splash').style.display='none';
  document.getElementById('login-screen').style.display='flex';
})();
</script>
</body>
